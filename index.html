function playMyVoice(){

 const audio = new Audio(MY_VOICE);

 audio.play().catch(function(){

   alert(
    "123.mp3 नहीं मिला। 123.mp3 को index.html के साथ उसी folder में रखें।"

function speak(text,lang="hi-IN"){

 if(!("speechSynthesis" in window)){

   alert("आपके browser में voice support नहीं है।");

   return;
 }

 speechSynthesis.cancel();

 const voice =
 new SpeechSynthesisUtterance(text);

 voice.lang=lang;
 voice.rate=.78;
 voice.pitch=1;

 speechSynthesis.speak(voice);

}

/* =====================================================
   SURAH SEARCH
===================================================== */

function searchSurah(){

 const q=
 document
 .getElementById("surahSearch")
 .value
 .toLowerCase();

 const list=
 surahs.filter(x=>
 x[1].toLowerCase().includes(q) ||
 x[2].includes(q) ||
 String(x[0])===q
 );

 let html="";

 list.forEach(x=>{

 html+=`

 <div class="card"
 onclick="loadSurah(${x[0]})">

 <span class="number">
 ${x[0]}
 </span>

 <b>${x[1]}</b>

 <div class="arabic">
 ${x[2]}
 </div>

 </div>

 `;

 });

 document
 .getElementById("surahGrid")
 .innerHTML=html;

}


/* =====================================================
   LOAD FULL SURAH FROM QURAN API
===================================================== */

async function loadSurah(number){

 const box=
 document.getElementById("surahDetail");

 box.innerHTML=`

 <div class="lesson">
 ⏳ Surah load हो रही है...
 </div>

 `;

 try{

 const response=
 await fetch(
 `https://api.alquran.cloud/v1/surah/${number}/editions/quran-uthmani,en.asad`
 );

 if(!response.ok)
 throw new Error("Network Error");

 const data=
 await response.json();

 const arabic=data.data[0];

 const english=data.data[1];

 let html="";

 arabic.ayahs.forEach((ayah,index)=>{

 const eng=
 english.ayahs[index]
 ?english.ayahs[index].text
 :"";

 html+=`

 <div class="lesson">

 <div class="arabic">

 ${ayah.text}

 <span class="small">
 ﴿${ayah.numberInSurah}﴾
 </span>

 </div>

 <div class="translation">

 <b>English:</b>
 ${eng}

 </div>

 <div class="toolbar">

 <button
 class="secondary"
 onclick='speak(${JSON.stringify(ayah.text)},"ar-SA")'>

 🔊 Arabic

 </button>

 </div>

 </div>

 `;

 });


 box.innerHTML=`

 <div class="panel">

 <h2>
 ${arabic.englishName}
 —
 ${arabic.name}
 </h2>

 <p class="muted">

 English:
 ${arabic.englishNameTranslation || ""}

 • Ayahs:
 ${arabic.numberOfAyahs}

 </p>

 ${
 number===1
 ?
 `
 <div class="lesson">

 <div class="arabic">
 الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ
 </div>

 <p>
 <b>Hindi:</b>
 सारी प्रशंसा अल्लाह के लिए है,
 जो सारे संसारों का पालनहार है।
 </p>

 <p>
 <b>English:</b>
 All praise is for Allah,
 Lord of the worlds.
 </p>

 </div>
 `
 :""
 }

 ${html}

 <div class="lesson">

 <b>🎙️ आपकी Voice Recording</b>

 <audio
 controls
 preload="none"
 src="${MY_VOICE}">
 </audio>

 <p class="small muted">

 यह आपकी दी हुई recording है।
 पूरे Quran को आपकी आवाज़ में सुनाने के लिए
 हर आयत की अलग recording चाहिए।

 </p>

 </div>

 </div>

 `;

 box.scrollIntoView({
  behavior:"smooth"
 });

 }

 catch(error){

 box.innerHTML=`

 <div class="error">

 ❌ Quran load नहीं हुआ।

 <br><br>

 Internet connection check करें।

 <br><br>

 <button
 class="primary"
 onclick="loadSurah(${number})">

 ↻ Retry

 </button>

 </div>

 `;

 }

}
